name: Inspect official nutrition sources
on:
  push:
    branches: [codex/uk-restaurant-catalogue]
    paths: [.github/workflows/nutrition-source-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests beautifulsoup4
      - name: Read public menu data
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          r=requests.get('https://www.nandos.co.uk/food/menu/commons-be874f9a21e04dd51083.js',timeout=40)
          r.raise_for_status()
          for needle in ['Regular','Large','factsForPortionSizes']:
              for m in list(re.finditer(re.escape(needle),r.text))[:10]:
                  print('NANDOS_SIZES',r.text[max(0,m.start()-150):m.start()+200])
          PY
