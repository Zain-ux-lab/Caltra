name: Inspect official nutrition sources
on:
  push:
    branches: [codex/uk-restaurant-catalogue]
    paths: [.github/workflows/nutrition-source-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests beautifulsoup4
      - name: Read public menu data
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          for file in ['NutritionTablePage-ay53UrW5.js','NutritionalInformationTable-QKPDTYq6.js','useFetchAllergensAndProducts-KlzkzVbd.js']:
              r=requests.get('https://allergensandnutritions.popeyesuk.com/assets/'+file,timeout=30)
              r.raise_for_status()
              print('PUBLIC_TABLE',file,r.text)
          r=requests.get('https://www.nandos.co.uk/food/menu/',timeout=30)
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          print('NANDOS_TEXT',soup.get_text(' ',strip=True)[:3000])
          print('NANDOS_SCRIPTS',[s.get('src') for s in soup.find_all('script') if s.get('src')])
          for m in re.finditer('page-data',r.text):
              print('NANDOS_ROUTE',r.text[max(0,m.start()-100):m.start()+250])
          PY
