name: Inspect official nutrition sources
on:
  push:
    branches: [codex/uk-restaurant-catalogue]
    paths: [.github/workflows/nutrition-source-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests beautifulsoup4
      - name: Read public official table
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          url='https://allergensandnutritions.popeyesuk.com/nutritional-information-table'
          r=requests.get(url,timeout=40)
          print('STATUS',r.status_code)
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          print('TEXT',soup.get_text(' ',strip=True))
          import re
          js=requests.get('https://allergensandnutritions.popeyesuk.com'+soup.find('script',src=True)['src'],timeout=40).text
          start=js.find('mt={auth:')
          print('ENDPOINTS',js[start:start+9000])
          for needle in ['NUTRITION_INFORMATION_TABLE','nutritionInformation','NutritionalInformation','NutritionInformation','.js']:
              positions=[m.start() for m in re.finditer(re.escape(needle),js)]
              for pos in positions[-15:]:
                  print('CONTEXT',js[max(0,pos-250):pos+400])
          url='https://www.nandos.co.uk/food/menu/'
          r=requests.get(url,timeout=40)
          print('NANDOS',r.status_code)
          if r.ok:
              soup=BeautifulSoup(r.text,'html.parser')
              print('NANDOSDATA',[(s.get('src') or s.get('href')) for s in soup.find_all(['script','link']) if 'page-data' in str(s)])
          PY
