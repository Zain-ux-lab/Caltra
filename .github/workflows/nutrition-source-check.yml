name: Inspect official nutrition sources
on:
  push:
    branches: [codex/uk-restaurant-catalogue]
    paths: [.github/workflows/nutrition-source-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests beautifulsoup4
      - name: Read public menu data
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          import json
          url='https://www.nandos.co.uk/food/menu/page-data/index/page-data.1793104315519.json'
          r=requests.get(url,timeout=40)
          r.raise_for_status()
          data=r.json()
          print('NANDOS_KEYS',list(data))
          def walk(x):
              if isinstance(x,dict):
                  if any('nutri' in k.lower() for k in x):
                      print('NANDOS_ITEM',json.dumps(x))
                      return
                  for v in x.values():walk(v)
              elif isinstance(x,list):
                  for v in x:walk(v)
          walk(data)
          PY
